<link rel="stylesheet" href="image.css">
<body>
    <div class="slider">
        <div class="slides">
            <img class="slide" src="black.png" alt="Image # 1">
            <img class="slide" src="blue.png" alt="Image # 1">
            <img class="slide" src="red.png" alt="Image # 1">
            <img class="slide" src="white.png" alt="Image # 1">
            <img class="slide" src="cream.png" alt="Image # 1">

        </div>
        <button class="prev" onclick="prevslide()">&#10094</button>
         <button class="next" onclick="nextslide()">&#10095</button>
    </div>
    <script src="image.js"></script>
</body>
</html>
